</filter>
<filter id="filter2_f_0_306" x="182.787" y="-88.8351" width="1111.26" height="569.738" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feGaussianBlur stdDeviation="114.548"/>
</filter>
<filter id="filter3_f_0_306" x="92.7398" y="-93.0961" width="1194.17" height="545.713" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feGaussianBlur stdDeviation="114.548"/>
</filter>
<!-- fades the glow in from the top so it has no hard upper edge (Figma's mask was a solid 90% rect) -->
<linearGradient id="glowFade" x1="0" y1="0" x2="0" y2="127" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#D9D9D9" stop-opacity="0"/>
